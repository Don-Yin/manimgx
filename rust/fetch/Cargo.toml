[package]
name = "fetch"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Others' sources for a build script: fetched at build time, named by the hash of their files."

[dependencies]
sha2 = "0.11.0"
tempfile = "3.27.0"

[dev-dependencies]
# a test port bound before it listens: connections to it are refused, and it stays the test's
socket2 = "0.6.5"
